<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="sageWash" cx="0.18" cy="0" r="0.7">
      <stop offset="0" stop-color="#6b8f71" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6b8f71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldWash" cx="0.92" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#c4a06a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c4a06a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8cfc0"/>
      <stop offset="1" stop-color="#cfc4b2"/>
    </linearGradient>
    <filter id="paperShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#281e14" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Page wash (matches resume site) -->
  <rect width="1200" height="630" fill="url(#desk)"/>
  <rect width="1200" height="630" fill="url(#sageWash)"/>
  <rect width="1200" height="630" fill="url(#goldWash)"/>

  <!-- Paper card -->
  <rect
    x="96"
    y="78"
    width="1008"
    height="474"
    rx="4"
    fill="#f3efe6"
    stroke="rgba(28,36,32,0.08)"
    stroke-width="2"
    filter="url(#paperShadow)"
  />

  <!-- Title block -->
  <text
    x="148"
    y="248"
    fill="#1c2420"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="86"
    font-weight="700"
  >John Berger</text>

  <!-- Accent rule -->
  <rect x="148" y="272" width="72" height="5" rx="2.5" fill="#6b8f71"/>

  <text
    x="148"
    y="330"
    fill="#4a5a4e"
    font-family="system-ui, Helvetica, sans-serif"
    font-size="32"
    font-weight="500"
  >Software Engineer / Atlanta, GA</text>
  <text
    x="148"
    y="388"
    fill="rgba(28,36,32,0.55)"
    font-family="system-ui, Helvetica, sans-serif"
    font-size="24"
  >Frontend-leaning full-stack developer &#183; focused on product, design, and UX.</text>

  <!-- Footer -->
  <text
    x="148"
    y="490"
    fill="rgba(28,36,32,0.45)"
    font-family="system-ui, Helvetica, sans-serif"
    font-size="22"
  >johnmberger.com/resume</text>

  <!-- Burger mark (same as favicon), scaled up -->
  <g transform="translate(980, 430) scale(3.4)">
    <path
      d="M4 22.5c0-1.2.8-2.2 2-2.5h20c1.2.3 2 1.3 2 2.5 0 1.8-2.2 3.5-12 3.5S4 24.3 4 22.5Z"
      fill="#D4A05A"
    />
    <path
      d="M5.5 21.2c.4-.6 1.2-1 2.1-1.1h16.8c.9.1 1.7.5 2.1 1.1"
      stroke="#C48A42"
      stroke-width="1"
      stroke-linecap="round"
    />
    <rect x="4.5" y="17.6" width="23" height="3.2" rx="1.5" fill="#6B3A22" />
    <path d="M5 16.2h22l-1.2 2.2H6.2L5 16.2Z" fill="#F0C04A" />
    <path
      d="M5 14.4c1.4.9 2.6-.4 4 .4 1.3.8 2.4-.5 3.8.3 1.4.8 2.5-.4 3.9.4 1.4.8 2.5-.5 3.9.3 1.4.8 2.5-.4 3.9.4.5.3 1 .2 1.5-.1v1.1H5v-2.8Z"
      fill="#5AAE4A"
    />
    <rect x="6" y="12.4" width="20" height="2.2" rx="1.1" fill="#D94A3A" />
    <path
      d="M4.5 12.2c0-4.2 3.8-7.7 11.5-7.7S27.5 8 27.5 12.2c0 .6-.4 1.1-1 1.1H5.5c-.6 0-1-.5-1-1.1Z"
      fill="#E8B86A"
    />
    <ellipse cx="11" cy="7.8" rx="1.1" ry="0.55" fill="#F5E6C8" transform="rotate(-25 11 7.8)" />
    <ellipse cx="16.2" cy="6.6" rx="1.1" ry="0.55" fill="#F5E6C8" transform="rotate(12 16.2 6.6)" />
    <ellipse cx="21" cy="8.1" rx="1.1" ry="0.55" fill="#F5E6C8" transform="rotate(-8 21 8.1)" />
    <ellipse cx="14" cy="9.6" rx="0.9" ry="0.45" fill="#F5E6C8" transform="rotate(20 14 9.6)" />
    <ellipse cx="19.2" cy="9.4" rx="0.9" ry="0.45" fill="#F5E6C8" transform="rotate(-18 19.2 9.4)" />
  </g>
</svg>
